[project]
name = "chiron-mcp-server"
version = "0.1.0"
description = "Chiron MCP server for Blender tutoring tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.0.0,<2.0.0",
  "Pillow>=10.0.0",
  "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "ruff>=0.5.0",
  "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
